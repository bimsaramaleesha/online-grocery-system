<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- LEADER ONLY. Shared head, navbar and footer used by every page. -->

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | Online Grocery'">Online Grocery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>

<!-- Same as head(title) but also loads ONE module stylesheet, e.g.
     headWithCss('Inventory', '/css/inventory.css') -->
<head th:fragment="headWithCss(title, css)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | Online Grocery'">Online Grocery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{${css}}">
</head>

<body>
<!--
  The navbar changes with the logged-in user (session.role is set by the auth module):
    guest    -> Shop, Login, Register
    CUSTOMER -> Shop, Cart, My Orders      (no admin tabs at all)
    ADMIN    -> Dashboard + every module tab (a tab for a module nobody has built yet simply shows "not built yet")
-->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark app-navbar sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="${session.role == 'ADMIN'} ? @{/admin} : @{/shop}">🛒 Online Grocery</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">

            <!-- left side: the tabs -->
            <ul class="navbar-nav me-auto" th:if="${session.role != 'ADMIN'}">
                <li class="nav-item"><a class="nav-link" th:href="@{/shop}">Shop</a></li>
                <li class="nav-item" th:if="${session.role == 'CUSTOMER'}"><a class="nav-link" th:href="@{/cart}">🛒 Cart</a></li>
                <li class="nav-item" th:if="${session.role == 'CUSTOMER'}"><a class="nav-link" th:href="@{/orders}">My Orders</a></li>
            </ul>
            <ul class="navbar-nav me-auto" th:if="${session.role == 'ADMIN'}">
                <li class="nav-item"><a class="nav-link" th:href="@{/admin}">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/inventory}">Inventory</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/suppliers}">Suppliers</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/admin/orders}">Orders</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/promos}">Promos</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/reviews}">Reviews</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/users}">Users</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/shop}">View Store ↗</a></li>
            </ul>

            <!-- right side: login / logout -->
            <div class="d-flex align-items-center gap-2" th:if="${session.role == null}">
                <a class="btn btn-sm btn-outline-light" th:href="@{/login}">Login</a>
                <a class="btn btn-sm btn-light" th:href="@{/register}">Register</a>
            </div>
            <div class="d-flex align-items-center gap-2" th:if="${session.role != null}">
                <span class="navbar-text text-white small">
                    <span class="badge rounded-pill" th:classappend="${session.role == 'ADMIN'} ? 'text-bg-warning' : 'text-bg-light'"
                          th:text="${session.role == 'ADMIN'} ? 'ADMIN' : 'CUSTOMER'">CUSTOMER</span>
                    <span th:text="${session.userName}">Name</span>
                </span>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-sm btn-outline-light">Logout</button>
                </form>
            </div>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="footer text-center text-muted py-3 mt-5">
    <small>Online Grocery Order Management System &middot; SE1020</small>
</footer>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/common.js}"></script>
</th:block>
</body>
</html>
