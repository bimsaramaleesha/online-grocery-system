<!DOCTYPE html>
<!--
  ONE form page used for BOTH Add and Edit.
  ${editMode} (set by the controller) decides the title, the URL and whether
  the type can be changed.
  th:object="${form}"  = this form is bound to the ItemForm object
  th:field="*{name}"   = connects the input to form.name (value + submit)
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Item Form - Online Grocery</title>
    <link rel="stylesheet" th:href="@{/css/inventory.css}">
</head>
<body>
<main class="container narrow">
    <h1 th:text="${editMode} ? 'Edit Item' : 'Add Item'">Add Item</h1>

    <p class="alert error" th:if="${error}" th:text="${error}"></p>

    <form th:object="${form}"
          th:action="${editMode} ? @{/inventory/{id}/edit(id=${form.id})} : @{/inventory/new}"
          method="post" class="card">

        <!-- Item type: choosable when adding, fixed when editing -->
        <div class="field" th:unless="${editMode}">
            <label for="type">Item type</label>
            <select id="type" th:field="*{type}">
                <option value="">-- choose --</option>
                <option value="PERISHABLE">Perishable (milk, vegetables...)</option>
                <option value="NON_PERISHABLE">Non-Perishable (rice, canned food...)</option>
            </select>
        </div>
        <div class="field" th:if="${editMode}">
            <label>Item ID</label>
            <input type="text" th:value="${form.id}" disabled>
            <input type="hidden" id="type" th:field="*{type}">
        </div>

        <div class="field">
            <label for="name">Name</label>
            <input type="text" id="name" th:field="*{name}">
        </div>
        <div class="field">
            <label for="category">Category</label>
            <input type="text" id="category" th:field="*{category}" placeholder="Dairy, Grains, Vegetables...">
        </div>
        <div class="row">
            <div class="field">
                <label for="price">Price</label>
                <input type="number" id="price" step="0.01" min="0" th:field="*{price}">
            </div>
            <div class="field">
                <label for="quantity">Quantity</label>
                <input type="number" id="quantity" step="1" min="0" th:field="*{quantity}">
            </div>
        </div>

        <!-- shown only for PERISHABLE (inventory.js hides/shows these blocks) -->
        <div id="perishableFields" class="type-fields">
            <div class="field">
                <label for="expiryDate">Expiry date</label>
                <input type="date" id="expiryDate" th:field="*{expiryDate}">
            </div>
        </div>

        <!-- shown only for NON_PERISHABLE -->
        <div id="nonPerishableFields" class="type-fields">
            <div class="row">
                <div class="field">
                    <label for="brand">Brand</label>
                    <input type="text" id="brand" th:field="*{brand}">
                </div>
                <div class="field">
                    <label for="shelfLifeMonths">Shelf life (months)</label>
                    <input type="number" id="shelfLifeMonths" step="1" min="1" th:field="*{shelfLifeMonths}">
                </div>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary" th:text="${editMode} ? 'Save Changes' : 'Add Item'">Save</button>
            <a th:href="@{/inventory}" class="btn btn-light">Cancel</a>
        </div>
    </form>
</main>
<script th:src="@{/js/inventory.js}"></script>
</body>
</html>
