<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: headWithCss('Log in', '/css/user.css')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container my-5">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-7 col-lg-5">
            <div class="card usr-card">
                <div class="card-body p-4 p-md-5">

                    <h1 class="h3 text-center mb-1">Welcome back</h1>
                    <p class="text-center text-muted mb-4">Log in to your account</p>

                    <div class="alert alert-success" role="alert" th:if="${message}" th:text="${message}"></div>
                    <div class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}"></div>
                    <div class="alert alert-info" role="alert" th:if="${param.logout != null}">You have been logged out.</div>
                    <div class="alert alert-info" role="alert" th:if="${param.deleted != null}">Your account has been deleted.</div>

                    <form th:object="${form}" th:action="@{/login}" method="post">
                        <input type="hidden" name="next" th:if="${next != null}" th:value="${next}">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email address</label>
                            <input type="email" id="email" class="form-control" th:field="*{email}"
                                   maxlength="254" autocomplete="email" placeholder="you@example.com" required autofocus>
                        </div>

                        <div class="mb-2">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" id="password" class="form-control" th:field="*{password}"
                                   maxlength="128" autocomplete="current-password" required>
                        </div>
                        <div class="form-check mb-4">
                            <input type="checkbox" id="showPassword" class="form-check-input"
                                   data-toggle-password="password">
                            <label for="showPassword" class="form-check-label small">Show password</label>
                        </div>

                        <button type="submit" class="btn btn-success w-100">Log in</button>
                    </form>

                    <div class="usr-demo-box mt-4 p-3 rounded-3 small">
                        <div class="fw-semibold mb-1">Quick Demo Logins:</div>
                        <div>Customer: <code>customer@grocery.lk</code> / <code>Customer@123</code></div>
                        <div>Admin: <code>admin@grocery.lk</code> / <code>Admin@123</code></div>
                    </div>

                    <p class="text-center mt-4 mb-0">
                        New customer?
                        <a th:href="@{/register}" class="text-success fw-semibold">Create a free account</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script th:src="@{/js/user.js}"></script>
</body>
</html>
