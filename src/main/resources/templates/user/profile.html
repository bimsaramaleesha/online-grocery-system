<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: headWithCss('My account', '/css/user.css')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container my-4 usr-narrow">

    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
        <div>
            <h1 class="h3 mb-1" th:text="${user.name}">Name</h1>
            <span class="badge usr-role"
                  th:classappend="${user.role == 'ADMIN'} ? 'usr-role-admin' : 'usr-role-customer'"
                  th:text="${user.role}">CUSTOMER</span>
            <small class="text-muted ms-1" th:text="${user.id}">U001</small>
        </div>
        <div class="d-flex gap-2">
            <a th:href="@{/users}" class="btn btn-outline-success" th:if="${user.role == 'ADMIN'}">Manage users</a>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-outline-secondary">Log out</button>
            </form>
        </div>
    </div>

    <div class="alert alert-success" role="alert" th:if="${message}" th:text="${message}"></div>
    <div class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}"></div>

    <form th:object="${form}" th:action="@{/users/profile}" method="post" class="card card-body mb-4">
        <h2 class="h5 mb-3">My details</h2>

        <div class="mb-3">
            <label for="name" class="form-label">Full name</label>
            <input type="text" id="name" class="form-control" th:field="*{name}" maxlength="100" required>
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input type="email" id="email" class="form-control" th:field="*{email}" maxlength="254" required>
        </div>

        <div th:if="${user.role == 'CUSTOMER'}">
            <div class="mb-3">
                <label for="phone" class="form-label">Phone</label>
                <input type="text" id="phone" class="form-control" th:field="*{phone}" maxlength="20"
                       placeholder="0771234567" autocomplete="tel">
            </div>
            <div class="mb-3">
                <label for="address" class="form-label">Delivery address</label>
                <input type="text" id="address" class="form-control" th:field="*{address}" maxlength="200"
                       autocomplete="street-address">
            </div>
        </div>

        <div class="mb-3" th:if="${user.role == 'ADMIN'}">
            <label for="department" class="form-label">Department</label>
            <input type="text" id="department" class="form-control" th:field="*{department}" maxlength="60">
        </div>

        <div>
            <button type="submit" class="btn btn-success">Save changes</button>
        </div>
    </form>


    <form th:object="${pwForm}" th:action="@{/users/profile/password}" method="post"
          class="card card-body mb-4" data-match-form>
        <h2 class="h5 mb-3">Change password</h2>

        <div class="mb-3">
            <label for="currentPassword" class="form-label">Current password</label>
            <input type="password" id="currentPassword" class="form-control" th:field="*{currentPassword}"
                   maxlength="128" autocomplete="current-password" required>
        </div>
        <div class="row">
            <div class="col-sm-6 mb-3">
                <label for="newPassword" class="form-label">New password</label>
                <input type="password" id="newPassword" class="form-control" th:field="*{newPassword}"
                       minlength="8" maxlength="128" autocomplete="new-password" required>
            </div>
            <div class="col-sm-6 mb-3">
                <label for="confirmPassword" class="form-label">Confirm new password</label>
                <input type="password" id="confirmPassword" class="form-control" th:field="*{confirmPassword}"
                       minlength="8" maxlength="128" autocomplete="new-password" required>
            </div>
        </div>
        <div class="form-check mb-3">
            <input type="checkbox" id="showPasswords" class="form-check-input"
                   data-toggle-password="currentPassword,newPassword,confirmPassword">
            <label for="showPasswords" class="form-check-label small">Show passwords</label>
        </div>
        <div>
            <button type="submit" class="btn btn-success">Change password</button>
        </div>
    </form>

    <form th:action="@{/users/profile/delete}" method="post"
          class="card card-body usr-danger usr-delete-form" th:attr="data-name=${user.name}">
        <h2 class="h5 text-danger mb-2">Delete my account</h2>
        <p class="small text-muted">This cannot be undone. Type your password to confirm.</p>
        <div class="row g-2">
            <div class="col-12 col-sm">
                <input type="password" name="password" class="form-control" maxlength="128"
                       placeholder="Your password" autocomplete="current-password" required>
            </div>
            <div class="col-12 col-sm-auto">
                <button type="submit" class="btn btn-outline-danger">Delete account</button>
            </div>
        </div>
    </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script th:src="@{/js/user.js}"></script>
</body>
</html>
