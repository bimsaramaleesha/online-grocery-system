<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: headWithCss('All Orders', '/css/user.css')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h1 class="h3 mb-0">All Orders</h1>
            <small class="text-muted">Every customer's orders. Open one to change its status.</small>
        </div>
        <a th:href="@{/admin}" class="btn btn-outline-secondary">← Dashboard</a>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-success">
                <tr><th>Order</th><th>Customer</th><th>Date</th><th>Payment</th><th class="text-end">Total (Rs.)</th><th>Status</th><th></th></tr>
                </thead>
                <tbody>
                <tr th:each="o : ${orders}">
                    <td class="fw-semibold" th:text="${o.orderId}">ORD001</td>
                    <td th:text="${o.userId}">U001</td>
                    <td th:text="${o.orderDate}">date</td>
                    <td th:text="${o.paymentMethod}">Cash</td>
                    <td class="text-end" th:text="${#numbers.formatDecimal(o.netAmount, 1, 'COMMA', 2, 'POINT')}">0.00</td>
                    <td><span th:class="${o.status.badgeClass}" th:text="${o.status.displayName}">Pending</span></td>
                    <td class="text-end"><a th:href="@{/orders/{id}(id=${o.orderId})}" class="btn btn-sm btn-outline-primary">View / Update</a></td>
                </tr>
                <tr th:if="${#lists.isEmpty(orders)}"><td colspan="7" class="text-center text-muted py-4">No orders yet.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
