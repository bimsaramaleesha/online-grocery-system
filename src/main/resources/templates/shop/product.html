<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: headWithCss('Product', '/css/shop.css')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container my-4">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/shop}">Shop</a></li>
            <li class="breadcrumb-item"><a th:href="@{/shop(category=${p.category})}" th:text="${p.category}">Category</a></li>
            <li class="breadcrumb-item active" th:text="${p.name}">Product</li>
        </ol>
    </nav>

    <div class="card">
        <div class="row g-0">
            <div class="col-md-5">
                <div class="shop-thumb shop-thumb-lg" th:classappend="'shop-grad-' + ${p.colorIndex}" th:text="${p.emoji}">🥛</div>
            </div>
            <div class="col-md-7">
                <div class="card-body p-4">
                    <span class="badge text-bg-light border mb-2" th:text="${p.typeLabel}">Type</span>
                    <h1 class="h3" th:text="${p.name}">Product name</h1>
                    <div class="text-muted mb-3" th:text="'Category: ' + ${p.category} + '  ·  Code: ' + ${p.id}">Category</div>

                    <div class="mb-3">
                        <span class="display-6 fw-bold text-success"
                              th:text="'Rs. ' + ${#numbers.formatDecimal(p.sellingPrice, 1, 'COMMA', 2, 'POINT')}">Rs. 0.00</span>
                        <span class="text-muted text-decoration-line-through ms-2" th:if="${p.onSale}"
                              th:text="'Rs. ' + ${#numbers.formatDecimal(p.price, 1, 'COMMA', 2, 'POINT')}">old</span>
                        <span class="badge text-bg-danger ms-2" th:if="${p.onSale}">20% OFF</span>
                    </div>

                    <p class="mb-2" th:text="${p.details}">Details</p>
                    <p class="mb-3">
                        <span class="badge text-bg-success" th:if="${p.inStock and !p.lowStock}">In stock</span>
                        <span class="badge text-bg-warning" th:if="${p.lowStock}" th:text="'Only ' + ${p.quantity} + ' left'">Low</span>
                        <span class="badge text-bg-secondary" th:if="${!p.inStock}">Sold out</span>
                    </p>

                    <form th:action="@{/cart/add}" method="post" class="d-flex gap-2" th:if="${session.role != null}">
                        <input type="hidden" name="itemId" th:value="${p.id}">
                        <input type="number" name="quantity" value="1" min="1" th:max="${p.quantity}"
                               class="form-control" style="max-width:100px;" th:disabled="${!p.inStock}">
                        <button type="submit" class="btn btn-success btn-lg" th:disabled="${!p.inStock}">🛒 Add to cart</button>
                    </form>
                    <a th:if="${session.role == null}" th:href="@{/login(next=${'/shop/' + p.id})}"
                       class="btn btn-success btn-lg">Login to buy</a>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-5" th:if="${!#lists.isEmpty(related)}">
        <h2 class="h4 mb-3">You may also like</h2>
        <div class="row g-3">
            <div class="col-6 col-md-3" th:each="r : ${related}">
                <a th:href="@{/shop/{id}(id=${r.id})}" class="text-decoration-none">
                    <div class="card shop-card h-100">
                        <div class="shop-thumb" th:classappend="'shop-grad-' + ${r.colorIndex}" th:text="${r.emoji}">🥛</div>
                        <div class="card-body p-2 text-center">
                            <div class="small fw-semibold text-dark" th:text="${r.name}">Name</div>
                            <div class="text-success fw-bold" th:text="'Rs. ' + ${#numbers.formatDecimal(r.sellingPrice, 1, 'COMMA', 2, 'POINT')}">Rs. 0</div>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
