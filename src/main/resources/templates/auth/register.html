<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: headWithCss('Register', '/css/auth.css')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container auth-wrap">
    <div class="card auth-card auth-card-wide">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="auth-logo">🎁</div>
                <h1 class="h3 mb-1">Create your account</h1>
                <p class="text-muted mb-0">Shop, order and track deliveries</p>
            </div>

            <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

            <form th:action="@{/register}" th:object="${form}" method="post">
                <div class="mb-3">
                    <label for="fullName" class="form-label">Full name</label>
                    <input type="text" id="fullName" class="form-control" th:field="*{fullName}" required>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" id="email" class="form-control" th:field="*{email}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="phone" class="form-label">Phone</label>
                        <input type="text" id="phone" class="form-control" th:field="*{phone}" placeholder="0771234567" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="address" class="form-label">Delivery address <span class="text-muted">(optional)</span></label>
                    <input type="text" id="address" class="form-control" th:field="*{address}">
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" class="form-control" name="password" minlength="6" required>
                    </div>
                    <div class="col-md-6 mb-4">
                        <label for="confirmPassword" class="form-label">Confirm password</label>
                        <input type="password" id="confirmPassword" class="form-control" name="confirmPassword" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-success btn-lg w-100">Create account</button>
            </form>

            <p class="text-center mt-4 mb-0">Already registered? <a th:href="@{/login}">Log in</a></p>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
