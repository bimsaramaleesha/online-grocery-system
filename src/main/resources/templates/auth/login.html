<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: headWithCss('Login', '/css/auth.css')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container auth-wrap">
    <div class="card auth-card">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="auth-logo">🛒</div>
                <h1 class="h3 mb-1">Welcome back</h1>
                <p class="text-muted mb-0">Log in to your account</p>
            </div>

            <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

            <form th:action="@{/login}" method="post">
                <input type="hidden" name="next" th:value="${next}" th:if="${next != null}">
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" name="email" class="form-control form-control-lg"
                           th:value="${email}" required autofocus>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password" class="form-control form-control-lg" required>
                </div>
                <button type="submit" class="btn btn-success btn-lg w-100">Log in</button>
            </form>

            <p class="text-center mt-4 mb-0">New here? <a th:href="@{/register}">Create a customer account</a></p>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
