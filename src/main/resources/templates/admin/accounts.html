<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: headWithCss('Accounts', '/css/admin.css')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h1 class="h3 mb-0">Accounts</h1>
            <small class="text-muted">Everyone who can log in. Passwords are stored as hashes and are never shown.</small>
        </div>
        <a th:href="@{/admin}" class="btn btn-outline-secondary">← Dashboard</a>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-success">
                <tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Level</th><th>Joined</th></tr>
                </thead>
                <tbody>
                <tr th:each="a : ${accounts}">
                    <td class="text-muted" th:text="${a.id}">U001</td>
                    <td class="fw-semibold" th:text="${a.fullName}">Name</td>
                    <td th:text="${a.email}">email</td>
                    <td th:text="${a.phone}">phone</td>
                    <td><span class="badge" th:classappend="${a.admin} ? 'text-bg-warning' : 'text-bg-success'"
                              th:text="${a.role.label}">Customer</span></td>
                    <td th:text="${a.createdDate}">date</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
